  return `<section class="pagehead"><div class="eyebrow">FAQ</div><h1>How the Ratings and Archetypes Work</h1><p class="lead">What every rating means, how it is calculated and how each player gets his two archetype labels. Every number on the site comes from the same ${D.meta.matches} FACEIT matches.</p></section>
  <div class="card" style="margin-top:18px"><div class="eyebrow">On This Page</div><div class="faqtoc">${toc.map(([id, t]) => `<button class="link" data-faq="${id}">${t}</button>`).join("")}</div></div>
  <div class="section">
  ${q("kinds", "What Are the Three Kinds of Numbers?", `<div class="tscroll"><table style="margin-top:8px"><thead><tr><th>Number</th><th>Example</th><th>What It Means</th></tr></thead><tbody>
    <tr><td><b>Match Rating</b></td><td class="num">1.20</td><td>Output per round on an HLTV-style scale, where 1.00 is roughly average. Shown as the Rating stat and in the Elo table.</td></tr>
    <tr><td><b>1-100 Rating</b></td><td class="num">84</td><td>Where the player's estimated true skill sits among everyone in the data (50 = average). Twelve of them: Overall plus eleven categories. Not adjusted for Elo.</td></tr>
    <tr><td><b>Elo-Adjusted Percentile</b></td><td class="num">71st</td><td>One stat against what players at the same FACEIT Elo usually post. Used on the stat rows, Leaderboards and Compare.</td></tr>
    </tbody></table></div>`)}
  ${q("rating", "How Is the Match Rating Calculated?", `<p class="note" style="color:var(--ink-2)">An HLTV 2.0-style formula applied to each match:</p>
    <div class="formula">Rating = 0.0073 × KAST% + 0.3591 × KPR − 0.5329 × DPR + 0.2372 × Impact + 0.0032 × ADR + 0.1587<br>Impact = 2.13 × KPR + 0.42 × APR − 0.41</div>
    <p class="note">KPR, DPR and APR = kills, deaths and assists per round; ADR = damage per round; KAST% = share of rounds with a kill, assist, survival or traded death. The Rating stat over several matches is weighted by rounds, so a 30-round match counts more than a 16-round one.</p>`)}
  ${q("rs", "What Is Round Swing % (RS%)?", (() => { const R = D.meta.rs || {}, f1 = v => v == null ? "–" : (v * 100).toFixed(1);
    const sites = (R.sites || []).filter(r => r[2] >= 60);
    const maps = [...new Set(sites.map(r => r[0]))];
    const siteRows = maps.map(m => { const a = sites.find(r => r[0] === m && r[1] === "A"), b = sites.find(r => r[0] === m && r[1] === "B");
      return `<tr><td>${esc(mapName(m))}</td><td class="r num">${a ? fmt(a[3] * 100, "pct") + ` <span class="note">(${a[2]})</span>` : "–"}</td><td class="r num">${b ? fmt(b[3] * 100, "pct") + ` <span class="note">(${b[2]})</span>` : "–"}</td></tr>`; }).join("");
    return `<p class="note" style="color:var(--ink-2)">Round Swing % measures how much a player moves his team's chance of winning each round. A model estimates that chance at every moment of every round; each kill, death, plant, defuse and bomb explosion moves it, and the move is credited to the players involved. <b>RS% = the win-probability points a player adds per round played</b>: +3.0% means he adds three points of round-win chance per round, on average.</p>
    <h4 class="faqh4">The round-state model</h4>
    <ul class="steps">
      <li><b>Players alive</b> on each side.</li>
      <li><b>Equipment</b>: the value of the gear each side's still-alive players bought at the start of the round. When a player dies, his gear leaves his side's total. Defuse kits among the alive CTs count too. Picked-up weapons and grenades already thrown are not seen.</li>
      <li><b>Bomb planted</b> or not.</li>
      <li><b>Time left</b>: the 1:55 round clock until the bomb is planted. From the plant on, the clock becomes the 40-second bomb timer, so a plant with 1:00 on the round clock leaves 0:40 to defuse.</li>
      <li><b>Map</b>, and the <b>bombsite</b> of the plant when the data supports it (see below).</li>
    </ul>
    <p class="note">The model is a set of gradient-boosted decision trees trained on ${R.snapshots ? R.snapshots.toLocaleString() : "–"} moments from ${R.rounds ? R.rounds.toLocaleString() : "–"} rounds in ${R.matches || "–"} matches. It is constrained so that an extra player alive, more equipment or an extra kit can never lower that side's chance. Every prediction used for credit comes from a version of the model that never saw that match. Accuracy on matches it did not see: Brier score ${R.brier ?? "–"} (guessing 50% scores ${R.brier_base ?? "–"}; lower is better), and the predicted chances are on average within ${f1(R.ece)} points of how often rounds were actually won.</p>
    <h4 class="faqh4">Who gets the credit</h4>
    <div class="tscroll"><table style="margin-top:6px"><thead><tr><th>Event</th><th>Credit</th></tr></thead><tbody>
      <tr><td><b>Kill</b></td><td>The swing (the rise in the killer's side's chance) is split: <b>50% to the killer</b>, and the other 50% shared by everyone who damaged the victim that round, in proportion to their damage (the killer's own damage included). A clean one-tap kill keeps 100%.</td></tr>
      <tr><td><b>Death</b></td><td>The victim loses the full swing, or <b>half of it if a teammate trades him within 5 seconds</b>.</td></tr>
      <tr><td><b>Plant</b></td><td>The planter gets the rise in the T side's chance.</td></tr>
      <tr><td><b>Defuse</b></td><td>The defuser gets the jump to a certain CT win.</td></tr>
      <tr><td><b>Explosion</b></td><td>The jump to a certain T win is shared equally by the Ts still alive.</td></tr>
      <tr><td>Team kill, fall or bomb death</td><td>The drop goes to the team-killer, or to the player who died.</td></tr>
    </tbody></table></div>
    <p class="note" style="margin-top:8px">Time running down on its own is credited to nobody, and nothing counts once a round is already decided (kills after the bomb has gone off, for example). A typical kill moves the round by about ${f1(R.kill_swing)} points. Kills in small, even fights (1v1, 2v2) swing it the most; kills when one side is already three or more players up (4v1, 5v1) swing it the least. Because traded deaths cost only half and objectives add credit, the average player-match sits slightly above zero (${R.rs_mean ?? "–"}%).</p>
    <h4 class="faqh4">Bombsites</h4>
    <p class="note">Some sites look harder to retake than others. Rounds where the bomb was planted, T win % (rounds in brackets):</p>
    <div class="tscroll"><table style="margin-top:6px"><thead><tr><th>Map</th><th class="r">A</th><th class="r">B</th></tr></thead><tbody>${siteRows || `<tr><td colspan="3" class="note">Not enough plants yet.</td></tr>`}</tbody></table></div>
    <p class="note" style="margin-top:8px">These raw rates mix the site with the situation at the plant (players alive, gear, time left) and with chance: a few hundred rounds per site still leaves several points of noise. Every time the model is refitted it is tested with and without a separate bombsite effect on rounds it did not see. ${R.site ? "The bombsite effect currently improves the predictions, so it is used." : `It currently does not improve the post-plant predictions (log-loss ${R.ll_site === R.ll_nosite ? (R.ll_site ?? "–") + " either way" : (R.ll_site ?? "–") + " with it vs " + (R.ll_nosite ?? "–") + " without"}), so the model uses the map only. It is switched on automatically once the data supports it.`}</p>
    <h4 class="faqh4">Recalibration</h4>
    <p class="note">The model is refitted on the whole database every time new demos are added, and every match's RS% is recomputed, so old numbers can move slightly as the model learns. Weekly awards already issued are locked and do not change. Last fitted ${esc(R.fitted || "–")} UTC.</p>
    <h4 class="faqh4">Where it is used</h4>
    <ul class="steps">
      <li><b>Stat rows, Leaderboards, Compare and Stat Over Time</b>: Round Swing % sits next to the Match Rating (all weapons; both sides or one).</li>
      <li><b>Weekly awards</b>: 30% of the Performance Score, the largest single ingredient (see <button class="link" type="button" data-faq="awards">Weekly Awards</button>).</li>
      <li><b>Archetypes</b>: replaces round win % in The Carry, Mr. Impact and The Anchor.</li>
      <li><b>Consistency</b>: its match-to-match spread and dud matches share the weight with the Match Rating's.</li>
    </ul>`; })())}
  ${q("calc", "How Are the 1-100 Ratings Calculated?", `<ol class="steps">
    <li><b>Break each category into ingredients.</b> Every ingredient is a rate (Consistency also uses match-to-match spreads) (for example kills per round, or headshots per kill). The next section lists each one and its weight.</li>
    <li><b>Compare with everyone.</b> Each rate is compared with the pooled rate across all ${D.meta.players_in_store.toLocaleString()} players in the data, not just the regulars. The comparison is not adjusted for Elo.</li>
    <li><b>Separate skill from luck of the draw.</b> A random-effects model measures how much players really differ on that ingredient (their true spread) and how noisy one player's number is, given how much data (rounds, kills, duels) it comes from. Rounds in the same match share teammates, opponents and form, so the match, not the round, is the unit of evidence.</li>
    <li><b>Shrink small samples.</b> The player's number is pulled toward the average in proportion to its noise, then expressed as a z-score on the true-skill scale. With 3 matches a player's ratings are pulled well toward 50 and carry wide bands; with 100 matches they sit close to his raw numbers.</li>
    <li><b>Combine the ingredients.</b> The category z-score is the weighted sum of the ingredient z-scores, divided by its own spread. The spread allows for ingredients that measure the same thing (kills and damage), using their true-skill correlations among players with 3+ matches.</li>
    <li><b>Convert to 1-100.</b> Rating = 100 × the normal-curve percentile of that z-score, kept between 1 and 100. 50 = average, 84 = one standard deviation of true skill above it, 98 = two above, 16 = one below.</li></ol>
    <p class="note" style="margin-top:10px">When the model finds no measurable spread between players on an ingredient (typical for rare events such as knife kills or pistol-round kills), the spread is borrowed from the closest measurable ingredient so the ingredient still counts.</p>`)}
  </div>
  <div class="section" id="faq-cats"><div><div class="eyebrow">Ingredients</div><h2 class="faqh2">What Each Rating Measures</h2><p class="lead">Weights add to 100% within each rating. “Lower is better” ingredients count in reverse.</p></div>
    <div class="grid g2">${FAQ_CATS.map(catCard).join("")}</div></div>
  <div class="section">
  ${q("overall", "How Is Overall Built?", `<p class="note" style="color:var(--ink-2)">Overall mixes eight skill ratings. Knifing, Luck and Consistency are left out: they describe the player but are not skill at winning rounds.</p>
    <div class="tscroll"><table style="margin-top:6px"><thead><tr><th>Rating</th><th class="r">Weight in Overall</th></tr></thead><tbody>${wSort(FAQ_OVERALL, r => r[1]).map(([c, w]) => `<tr><td>${c}</td><td class="r num">${pct(w)}</td></tr>`).join("")}</tbody></table></div>
    <p class="note" style="margin-top:8px">Overall is the weighted sum of the eight category scores, rescaled by its own true-skill spread. That spread is worked out from the correlations of all the ingredients at once, so categories that overlap (Aiming and Entrying, say) don't stretch the scale. It is the number in the ring on each player's page.</p>`)}
  ${q("bands", "What Do the Bands, Match Windows and Small Samples Mean?", `<ul class="steps">
    <li><b>Band</b> (for example 71-88): the rating one standard error either side, about a two-in-three range for the player's true level. It allows for correlated noise between ingredients. A wide band means little data.</li>
    <li><b>Last 10 / 30 / 50</b>: the same model scored on only those matches, against the same all-data average and spread, so the scale doesn't move between windows. A shorter window has less evidence and is pulled harder toward 50. A window only appears when the player has that many matches.</li>
    <li><b>Consistency</b> uses the spread of the player's match ratings, Round Swing % and ADR (on a log scale, shrunk toward the typical spread when the player has few matches), plus the share of dud matches (rated below 0.80, or with a Round Swing % that low). It needs 3+ matches of 10+ rounds.</li>
    <li><b>Why are newcomers' ratings less extreme?</b> Three matches is weak evidence, so the model pulls them toward average and gives them wide bands until the data says otherwise.</li></ul>`)}
  ${q("arch", "How Are Archetypes Assigned?", `<ol class="steps">
    <li><b>Traits.</b> Each archetype is a weighted mix of traits (the tables below). The traits are ratings or shrunk true-skill z-scores, so small samples are pulled toward average here too. A minus weight means less of that trait fits better.</li>
    <li><b>Fit.</b> The weighted sum is divided by its own true-skill spread and shown as 100 × its normal-curve percentile: fit 50 = a typical player on that mix, fit 84 = one standard deviation more of it.</li>
    <li><b>Labels.</b> The primary label is the best-fitting archetype and the secondary is the next best; both are shown on the Overview tab. When the two are within a quarter of a standard deviation, the page flags a close call.</li>
    <li><b>Mr. Average</b> is scored differently. It compares how far the ten category ratings other than Consistency sit from 50 with how far a typical player's would sit with the same amount of data. Fewer extremes than expected = a better fit.</li>
    <li><b>Mr. Inconsistent</b> needs 3+ matches of 10+ rounds, like the Consistency rating.</li></ol>`)}
  </div>
  <div class="section" id="faq-types"><div><div class="eyebrow">Archetypes</div><h2 class="faqh2">The 11 Archetypes</h2><p class="lead">Weights are shares of each archetype's mix. Counts and best fits use all matches and update with the data.</p></div>
    <div class="grid g2">${FAQ_ARCH.map(archCardF).join("")}</div></div>
  <div class="section">
  ${q("awards", "How Do the Weekly Awards Work?", (() => { const A = D.awards || {}, Wt = A.weights || {};
    const lab = {rating:"Match Rating", rs:"Round Swing % (round win probability added per round)", adr:"ADR (damage per round)", kast:"KAST", round_win:"Team round win %", open_net:"Opening duels: (opening kills − opening deaths) per round", multikill:"Multi-kill rounds (2+ kills) per round", clutch:"Clutch wins per round (1v1 = 1, 1v2 = 2, 1v3+ = 3)"};
    const core = D.players.filter(x => x.core).map(x => esc(x.name)).join(", ");
    return `<p class="note" style="color:var(--ink-2)">Every week (Monday to Sunday, US Eastern time) the Core-5 (${core}) compete for six awards, shown on the Home page. Each match gets one score from these ingredients.</p>
    <div class="tscroll"><table style="margin-top:6px"><thead><tr><th>Ingredient</th><th class="r">Weight</th></tr></thead><tbody>${wSort(Object.entries(Wt), r => r[1]).map(([k, w]) => `<tr><td>${lab[k] || esc(k)}</td><td class="r num">${pct(w)}</td></tr>`).join("")}</tbody></table></div>
    <ul class="steps" style="margin-top:10px">
      <li><b>Match Score.</b> Each ingredient is turned into a z-score against every non-pro player-match in the database, the weighted z-scores are added, and the total is rescaled so <b>50 = an average player-match</b> and <b>10 points = one standard deviation of single matches</b>.</li>
      <li><b>Weekly Score.</b> The week's matches are averaged (each weighted by its rounds) and put on a wider scale. 50 is still the database average, but <b>10 points = one standard deviation of Core-5 weekly averages</b>. Averages over many matches vary far less than single matches, so on the match scale a whole week's gap between best and worst would fit in a few points.</li>
      <li>Both yardsticks are frozen. Round Swing % is recalibrated whenever new demos are added, so past match scores can move slightly, but <b>awards already issued are locked</b> and never change.</li>
      <li><b>Player of the Week</b> and <b>Weekly Shackles</b>: highest and lowest Weekly Score. The player needs ${A.min_matches || 3}+ matches that week.</li>
      <li><b>Most Improved Player</b> and <b>Most Washed Player</b>: biggest rise and biggest drop in Weekly Score from the week before. The player needs ${A.min_matches || 3}+ matches in both weeks.</li>
      <li><b>Performance of the Week</b> and <b>Dishonorable Mention</b>: best and worst Match Score of the week (${A.min_rounds || 10}+ rounds).</li>
      <li><b>Round Swing %</b>: round win probability added per round through kills, deaths, plants, defuses and explosions (see <button class="link" type="button" data-faq="rs">Round Swing</button>). It replaced team round win % on Oct 5, 2026, and every week was re-scored once at that point.</li>
      <li><b>When awards are issued.</b> A week's awards are issued once all of its matches are in the database, and they are recorded in an award register. Weeks start from ${esc(wkLabel(A.coverage_start || "2026-08-24"))}, the first full week with every Core-5 match collected. Badges on player pages count the awards; hover over one to see its name and weeks.</li>
      <li><b>Ties</b> go to the player with more matches.</li></ul>`; })())}
  ${q("pct", "How Do the Elo-Adjusted Percentiles Differ?", `<p class="note" style="color:var(--ink-2)">The stat rows, Leaderboards and Compare use a different yardstick. For each stat, a line of expected value against pre-match Elo is fitted on every player's matches. The player's gap to that line is shrunk with the same model as the ratings, and the percentile is the share of players he is estimated to be better than, given his Elo. A 2,800 Elo player needs a better number than a 1,800 Elo player to reach the same percentile. A stat where players don't differ measurably once Elo is allowed for is shown but not ranked.</p>`)}
  </div>`;
}

function setStickyTop(){                                       // v4.21: frozen Leaderboard header sits under the sticky bars
  const ab = document.querySelector(".appbar"), f = document.querySelector("#app .filters"); if (!ab) return;
  let top = ab.getBoundingClientRect().height;
  if (f && getComputedStyle(f).position === "sticky") top = (parseFloat(getComputedStyle(f).top) || top) + f.getBoundingClientRect().height;
  document.documentElement.style.setProperty("--lbtop", (Math.floor(top) - 1) + "px");      // 1 px overlap: no sub-pixel seam
}
addEventListener("resize", () => { if (S.view === "board") setStickyTop(); });

  let html = "";
  if (S.view === "player" && S.p !== null) html = viewPlayer();
  else if (S.view === "compare") html = viewCompare();
  else if (S.view === "sim") html = viewSim();
  else if (S.view === "core5") html = viewCore5();
  else if (S.view === "board") html = viewBoard();
  else if (S.view === "maps") html = viewMaps();
  else if (S.view === "spots") html = viewSpots();
  else if (S.view === "faq") html = viewFaq();
  else if (S.view === "updates") html = viewUpdates();
  else if (S.view === "players") html = viewPlayers();
  else if (S.view === "match" && S.mid) html = viewMatch();
  else { S.view = "home"; html = viewHome(); }
  html += `<p class="foot">Built from ${D.meta.matches} FACEIT matches · ${D.players.length} regulars (3+ matches) · data ${esc(D.meta.built_utc)} · pipeline v${esc(D.meta.version)}. Percentiles are Elo-adjusted and shrunk toward 50 for small samples.</p>`;
  SIMTOK++;                                                // stops a running 1v1 simulation
  app.innerHTML = html;
  if (S.view === "board") setStickyTop();

  if (S.view === "sim") { bindSim(); simStart(); }
  drawCharts();
  mvStop(); if (S.view === "match") mvDrawMap();
  saveState();
}

  onSeg("s-mode", v => { S.heatMode = {"Where They Stand":"pres", "Where Kills Come From":"kills", "Where They Die":"deaths", "Hotspots":"hot"}[v]; render(); });
  onSeg("s-level", v => { S.spots.level = v; render(); });
  const q2 = $("#q2"); if (q2) wireSearch(q2, $("#sugg2"));
  const awk = $("#aw-week"); if (awk) awk.addEventListener("change", () => { const y = scrollY; S.awk = +awk.value; render(); scrollTo(0, y); });
  document.querySelectorAll("[data-go2]").forEach(b => b.addEventListener("click", () => go(b.dataset.go2)));
  document.querySelectorAll("[data-faqto]").forEach(b => b.addEventListener("click", () => { const id = b.dataset.faqto; go("faq");
    requestAnimationFrame(() => { const t = document.getElementById("faq-" + id); if (t) t.scrollIntoView({block:"start"}); }); }));
  const hm = $("#home-more"); if (hm) hm.addEventListener("click", () => { const y = scrollY; S.homeAll = !S.homeAll; render(); scrollTo(0, y); });
  if (S.view !== "match") document.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => go("player", +b.dataset.p)));
  onSeg("f-win", v => { S.win = v; S.winSet = true; render(); });
  onSeg("f-side", v => { S.side = v; render(); });
  onSeg("f-wf", v => { S.wf = v; render(); });
  document.querySelectorAll(".tabs:not(.mv-tabs) button").forEach(b => b.addEventListener("click", () => { S.tab = b.dataset.tab; const tb = $("#tabbody"); killCharts(); tb.innerHTML = tabBody(S.p); document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x===b)); bindTab(); drawCharts(); saveState(); }));
  bindTab();
  const bm = $("#b-metric"); if (bm) bm.addEventListener("change", () => { S.board.metric = bm.value; render(); });
  // v4.22 player filters: apply on change (Enter / leaving the box / spinner), keep focus-friendly
  for (const [id, k] of [["b-minm","minM"],["b-elo0","eloMin"],["b-elo1","eloMax"]]){ const el = $("#"+id); if (!el) continue;
    const apply = () => { const v = bnum(el.value); if (v === bnum(S.board[k])) return; S.board[k] = v; const had = document.activeElement === el, y = scrollY; render(); scrollTo(0, y); if (had){ const n = $("#"+id); if (n) n.focus(); } };
    el.addEventListener("change", apply); el.addEventListener("keydown", e => { if (e.key === "Enter") apply(); }); }
  const bpr = $("#b-popreset"); if (bpr) bpr.addEventListener("click", () => { S.board.minM = S.board.eloMin = S.board.eloMax = null; S.board.tag = "All players"; render(); });
  onSeg("b-tag", v => { S.board.tag = v; render(); });
  onSeg("b-win", v => { S.win = v; render(); }); onSeg("b-side", v => { S.side = v; render(); }); onSeg("b-wf", v => { S.wf = v; render(); });
  onSeg("b-sort", v => { S.board.sort = v === "Elo-adjusted" ? "pct" : "raw"; render(); });
  onSeg("b-ranked", v => { S.board.ranked = v === "Ranked only"; render(); });
  const mm = $("#m-map"); if (mm) mm.addEventListener("change", () => { S.maps.map = mm.value; render(); });
  onSeg("m-scope", v => { S.maps.scope = v; render(); });
  const sm = $("#s-map"); if (sm) sm.addEventListener("change", () => { S.spots.map = sm.value; render(); });
  document.querySelectorAll("[data-faq]").forEach(b => b.addEventListener("click", () => { const t = document.getElementById("faq-" + b.dataset.faq); if (t) t.scrollIntoView({behavior:"smooth", block:"start"}); }));
  onSeg("s-side", v => { S.spots.side = v; render(); }); onSeg("s-snap", v => { S.spots.snap = +v; render(); }); onSeg("s-scope", v => { S.spots.scope = v; render(); });
}
function bindTab(){
  document.querySelectorAll("select.ts-metric").forEach(el => el.addEventListener("change", () => { const k = tsKeys(); k[+el.dataset.j] = el.value; S.ts.metric = k[0]; saveState(); rerenderTab(); }));
  document.querySelectorAll("button.tsx").forEach(el => el.addEventListener("click", () => { const k = tsKeys(); k.splice(+el.dataset.j, 1); S.ts.metric = k[0]; saveState(); rerenderTab(); }));
  const tadd = $("#ts-add"); if (tadd) tadd.addEventListener("click", () => { const k = tsKeys(); const pool = ["kpr","hs_pct","duel_wr","sight_to_shot","xhair_err","first_shot_hit","traded_5s","kast","rating"]; k.push(pool.find(x => !k.includes(x) && midx(x) >= 0) || "adr"); saveState(); rerenderTab(); });
  onSeg("ts-z", v => { S.ts.z = v === "Standardized"; saveState(); rerenderTab(); });
  onSeg("ts-k", v => { S.ts.k = parseInt(v, 10); saveState(); rerenderTab(); });
  onSeg("sp-w", v => { S.spw = v; slStop(); S.spk = null; rerenderTab(); });
  const spk = $("#sp-k"); if (spk) spk.addEventListener("input", () => { slStop(); S.spk = +spk.value; sprayLab(); });
  const spb = $("#sp-play"); if (spb) spb.addEventListener("click", () => { if (slTimer) return slStop(); S.spk = 1; sprayLab(); spb.textContent = "Stop";
    slTimer = setInterval(() => { const mx = +($("#sp-k") || {max:1}).max; if (!$("#sl-pat") || S.spk >= mx) return slStop(); S.spk++; sprayLab(); }, 110); });
  const pm = $("#ph-map"); if (pm) pm.addEventListener("change", () => { S.pheat.map = pm.value; S.pheat.level = null; if (S.map !== "All maps") S.map = pm.value; rerenderTab(); });
  onSeg("ph-mode", v => { S.pheat.mode = {"Where They Stand":"stand", "Where They Get Kills":"kills", "Where They Die":"deaths", "Hotspots":"hot"}[v]; rerenderTab(); });
  onSeg("ph-level", v => { S.pheat.level = v; rerenderTab(); });
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
  document.querySelectorAll("#tabbody [data-p]").forEach(b => b.addEventListener("click", () => go("player", +b.dataset.p)));
  document.querySelectorAll("[data-def]").forEach(b => b.addEventListener("click", () => { const k = b.dataset.def; S.open[k] = !S.open[k]; const y = window.scrollY; if ($("#tabbody") && $("#tabbody").contains(b)) { killCharts(); $("#tabbody").innerHTML = tabBody(S.p); bindTab(); drawCharts(); } else render(); window.scrollTo({top:y}); }));
}

document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => go(b.dataset.view)));
document.addEventListener("keydown", e => { if (e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); } });
$("#brand").addEventListener("click", e => { e.preventDefault(); go("home"); });
window.addEventListener("popstate", e => { if (!D) return; const st = e.state || {}; selRestore(st.sel); fromHash(); render(); requestAnimationFrame(() => window.scrollTo({top: st.y || 0})); });
window.addEventListener("pagehide", saveState);
let sy; window.addEventListener("scroll", () => { clearTimeout(sy); sy = setTimeout(saveState, 200); }, {passive:true});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (D){ drawHeat(); drawPlayerHeat(); sprayLab(); } }, 150); });
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => D && render());
new MutationObserver(() => D && drawCharts()).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});

const embedded = document.getElementById("tickrate-data");
// data.json.gz first (about 1/7 the size; decompressed in the browser), else the plain data.json
const loadData = async () => {
  try {
    const r = await fetch("data.json.gz", {cache: "no-cache"});
    if (!r.ok) throw new Error(r.status);
    const b = new Uint8Array(await r.arrayBuffer());
    if (b[0] === 0x1f && b[1] === 0x8b) {                  // gzip bytes: decompress here
      if (!window.DecompressionStream) throw new Error("no DecompressionStream");
      return JSON.parse(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
    }
    return JSON.parse(new TextDecoder().decode(b));        // server already decoded it
  } catch (e) {
    const r = await fetch("data.json", {cache: "no-cache"});
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }
};
(embedded ? Promise.resolve(JSON.parse(embedded.textContent)) : loadData()).then(d => {
  D = d;
  try { localStorage.removeItem("tickrate.state"); } catch(e) {}      // v4.25: selections no longer persist across visits
  const hs = history.state || {};
  selRestore(hs.sel);
  wireSearch($("#q"), $("#sugg"));
  fromHash();
  render();
  history.replaceState({sel: selSnap(), y: hs.y || 0}, "");
  if (hs.y) requestAnimationFrame(() => window.scrollTo({top: hs.y}));
}).catch(err => { $("#app").innerHTML = `<div class="loading">Couldn't load the database (data.json): ${esc(err.message)}. Reload the page to try again.</div>`; });
})();
</script>
